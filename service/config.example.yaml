#=======应用========
app_name: chain
secret_key: change_me
algorithm: HS256
access_token_expire_minutes: 30
prompt_dir: prompts
log:
  dir: data/log
  level: info
  formatter: '%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s'

#=======数据库======
db:
  host: 127.0.0.1
  port: 3306
  user: root
  password: your-mysql-password
  database: chain
  charset: utf8mb4
  # 也可以直接配置完整连接串；配置后会优先使用 url。
  # url: mysql+pymysql://root:your-mysql-password@127.0.0.1:3306/chain?charset=utf8mb4
  # LangGraph checkpoint 是异步保存器；不配置时会自动把 mysql+pymysql 转成 mysql+aiomysql。
  # checkpoint_url: mysql+aiomysql://root:your-mysql-password@127.0.0.1:3306/chain?charset=utf8mb4

#======Redis=========
redis:
  enabled: false
  host: 127.0.0.1
  port: 6379
  db: 0
  password: ""
  socket_timeout: 2
  socket_connect_timeout: 2

#======大语言模型=====
chat:
  model: qwen3-max
  api_key: sk-your-key

embedding:
  model: text-embedding-v4
  dashscope_api_key: sk-your-key

#======天气查询======
weather:
  api_key: your-amap-web-service-key

#======RAG===========
rag:
  collection_name: chroma
  persist_dir: data/chroma
  chunk_size: 500
  chunk_overlap: 50
  k: 5
  max_distance:
  max_context_chars: 6000
  rerank_candidates: 5
  separators: ["\n\n", "。", ".", "?", "，", "!", " ", ""]
  allow_file_type: ['.txt', '.pdf']
