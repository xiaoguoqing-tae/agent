#=======应用========
app_name: chain
secret_key: change_me
algorithm: HS256
access_token_expire_minutes: 30
prompt_dir: prompts
log:
  dir: data/log
  level: info
  formatter: '%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s'

#=======数据库======
db:
  dir: data/db

#======Redis=========
redis:
  enabled: false
  host: 127.0.0.1
  port: 6379
  db: 0
  password: ""
  socket_timeout: 2
  socket_connect_timeout: 2

#======大语言模型=====
chat:
  model: qwen3-max
  api_key: sk-your-key

embedding:
  model: text-embedding-v4
  dashscope_api_key: sk-your-key

#======天气查询======
weather:
  api_key: your-amap-web-service-key

#======RAG===========
rag:
  collection_name: chroma
  persist_dir: data/chroma
  chunk_size: 500
  chunk_overlap: 50
  k: 5
  separators: ["\n\n", "。", ".", "?", "，", "!", " ", ""]
  allow_file_type: ['.txt', '.pdf']
